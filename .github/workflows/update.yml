name: Update profile statistics

on:
    schedule:
        - cron: "17 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: profile-statistics
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Check stats token
              env:
                  STATS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate stats card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: stats
                  options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=101e28&title_color=6ad7bc&icon_color=6ad7bc&text_color=b8ccc9
                  path: profile/stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Commit updated card
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add profile/stats.svg
                  if git diff --cached --quiet; then
                    exit 0
                  fi
                  git commit -m "Update profile statistics"
                  git push
